    .page {
      width: min(720px, 100%); position: relative; overflow: hidden;
      background: transparent; backdrop-filter: none; border: 3px solid rgba(242, 138, 189, .95);
      border-radius: 25px; padding: 34px; box-shadow: 0 18px 45px #6f294b66;
    }
    .by {
      position: absolute; top: 15px; right: 20px; color: #d64d94;
      font-size: 12px; font-weight: 800; letter-spacing: 1px;
    }
    header { text-align: center; padding: 10px 0 24px; }
    .avatar {
      width: 112px; height: 112px; object-fit: cover; object-position: center 25%;
      border-radius: 50%; border: 4px solid #f28abd;
      box-shadow: 0 5px 16px #d65b9a55;
    }
    h1 { margin: 14px 0 5px; color: #ed69aa; font-size: clamp(30px, 7vw, 48px); }
    .subtitle { margin: 0; color: #ffffff; text-shadow: 0 1px 4px rgba(0,0,0,.9); }
    h2 { color: #d64d94; font-size: 20px; margin: 0 0 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    label { display: block; font-weight: 700; font-size: 13px; color: #ffffff; text-shadow: 0 1px 4px rgba(0,0,0,.9); }
    input, select, textarea {
      width: 100%; margin-top: 7px; padding: 12px;
      border: 1.5px solid #efb0d0; border-radius: 10px;
      background: rgba(35, 12, 27, .58); color: #ffffff; font: inherit; color: #3b2433; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #e45b9e; box-shadow: 0 0 0 3px #f8d5e7; }
    .full { grid-column: 1 / -1; }
    textarea { min-height: 95px; resize: vertical; }
    button {
      display: block; margin: 22px auto 0; border: 0; border-radius: 999px;
      padding: 13px 30px; color: white; background: #e765a6;
      font-size: 15px; font-weight: 800; cursor: pointer;
    }
    button:hover { background: #ce4d90; }
    footer { text-align: center; color: #ffffff; text-shadow: 0 1px 4px rgba(0,0,0,.9); font-size: 12px; margin-top: 22px; }
    @media (max-width: 540px) {
      .page { padding: 28px 20px; }
      .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
    }
  </style>

      <form id="applicationForm">
        <div class="form-grid">
          <label>Nombre completo
            <input type="text" name="nombre" placeholder="Escribe tu nombre" required>
          </label>
          <label>Edad
            <input type="number" name="edad" min="13" max="99" placeholder="Tu edad" required>

            <input type="text" name="usuario" placeholder="@usuario" required>

<script>
const applicationForm = document.getElementById('applicationForm');
applicationForm.addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = applicationForm.querySelector('button[type="submit"]');
  const original = button.textContent;
  button.disabled = true;
  button.textContent = 'Enviando...';
  try {
    const payload = Object.fromEntries(new FormData(applicationForm).entries());
    const response = await fetch('/api/solicitud', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!response.ok) throw new Error('send failed');
    alert('Solicitud enviada correctamente.');
    applicationForm.reset();
  } catch {
    alert('No se pudo enviar. Inténtalo más tarde.');
  } finally {
    button.disabled = false;
    button.textContent = original;
  }
});
</script>
